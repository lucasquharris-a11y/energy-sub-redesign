<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — Energy Substantiation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg-primary: #08080c;
  --bg-elevated: #0f0f14;
  --bg-card: #13131a;
  --bg-card-hover: #1a1a24;
  --text-primary: #f0ece4;
  --text-secondary: rgba(240, 236, 228, 0.6);
  --text-tertiary: rgba(240, 236, 228, 0.35);
  --gold: #d4a44a;
  --gold-glow: rgba(212, 164, 74, 0.15);
  --gold-dim: rgba(212, 164, 74, 0.6);
  --blue-energy: #4a8bd4;
  --border: rgba(255, 255, 255, 0.06);
  --border-hover: rgba(255, 255, 255, 0.12);
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --font-sans: 'Inter', -apple-system, sans-serif;
}

html, body {
  height: 100%;
  font-family: var(--font-sans);
  background: var(--bg-primary);
  color: var(--text-primary);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  position: relative;
  overflow: hidden;
}

/* ── Noise grain overlay ── */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
  background-repeat: repeat;
  background-size: 256px;
  pointer-events: none;
  z-index: 0;
}

/* ── Background glows ── */
.bg-glow-gold {
  position: fixed;
  top: 30%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 600px;
  height: 600px;
  background: radial-gradient(circle, rgba(212, 164, 74, 0.07) 0%, transparent 65%);
  filter: blur(80px);
  pointer-events: none;
  z-index: 0;
}

.bg-glow-blue {
  position: fixed;
  bottom: 10%;
  left: 20%;
  width: 400px;
  height: 400px;
  background: radial-gradient(circle, rgba(74, 139, 212, 0.04) 0%, transparent 65%);
  filter: blur(60px);
  pointer-events: none;
  z-index: 0;
}

/* ── Outer wrapper ── */
.onboarding-wrapper {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 480px;
  padding: 0 24px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* ── Logo ── */
.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 48px;
  opacity: 0;
  animation: fadeUp 0.6s ease-out forwards;
}

.logo-icon {
  display: flex;
  flex-direction: column;
  gap: 2px;
  width: 18px;
}

.logo-icon span {
  display: block;
  height: 2.5px;
  background: var(--gold);
  border-radius: 1px;
}

.logo-text {
  display: flex;
  flex-direction: column;
  font-weight: 700;
  font-size: 15px;
  letter-spacing: -0.01em;
  line-height: 1.15;
  color: var(--text-primary);
}

/* ── Progress indicator ── */
.progress {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 32px;
  opacity: 0;
  animation: fadeUp 0.6s ease-out 0.1s forwards;
}

.progress-step {
  width: 32px;
  height: 3px;
  border-radius: 2px;
  background: rgba(255, 255, 255, 0.06);
  transition: all 0.4s ease;
  position: relative;
  overflow: hidden;
}

.progress-step.active {
  background: var(--gold);
  box-shadow: 0 0 8px rgba(212, 164, 74, 0.3);
}

.progress-step.active::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.3) 50%, transparent 100%);
  animation: shimmer 2s ease-in-out infinite;
}

@keyframes shimmer {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(100%); }
}

.progress-label {
  font-size: 12px;
  font-weight: 500;
  color: var(--text-tertiary);
  letter-spacing: 0.04em;
  margin-left: 4px;
}

/* ── Card ── */
.card {
  width: 100%;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 44px 40px 40px;
  position: relative;
  overflow: hidden;
  opacity: 0;
  animation: fadeUp 0.7s ease-out 0.15s forwards;
}

/* Card top sheen */
.card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent 0%, rgba(212, 164, 74, 0.15) 30%, rgba(212, 164, 74, 0.25) 50%, rgba(212, 164, 74, 0.15) 70%, transparent 100%);
}

/* Card inner glow */
.card::after {
  content: '';
  position: absolute;
  top: -80px;
  left: 50%;
  transform: translateX(-50%);
  width: 300px;
  height: 160px;
  background: radial-gradient(ellipse, rgba(212, 164, 74, 0.04) 0%, transparent 70%);
  pointer-events: none;
}

.card-header {
  text-align: center;
  margin-bottom: 36px;
  position: relative;
  z-index: 1;
}

.card-header h1 {
  font-family: var(--font-sans);
  font-size: 28px;
  font-weight: 600;
  line-height: 1.2;
  letter-spacing: -0.01em;
  margin-bottom: 10px;
}

.card-header p {
  font-size: 14px;
  color: var(--text-secondary);
  line-height: 1.5;
}

/* ── Form ── */
.form-group {
  margin-bottom: 20px;
  position: relative;
  z-index: 1;
}

.form-label {
  display: block;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
  margin-bottom: 8px;
  letter-spacing: 0.02em;
}

.form-input {
  width: 100%;
  padding: 14px 16px;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-primary);
  font-family: var(--font-sans);
  font-size: 14px;
  font-weight: 400;
  outline: none;
  transition: border-color 0.25s ease, box-shadow 0.25s ease;
}

.form-input::placeholder {
  color: var(--text-tertiary);
}

.form-input:focus {
  border-color: rgba(212, 164, 74, 0.3);
  box-shadow: 0 0 0 3px rgba(212, 164, 74, 0.06);
}

.form-input:hover:not(:focus) {
  border-color: var(--border-hover);
}

/* Password wrapper */
.input-wrapper {
  position: relative;
}

.input-wrapper .form-input {
  padding-right: 48px;
}

.toggle-password {
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  color: var(--text-tertiary);
  cursor: pointer;
  padding: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: color 0.2s;
}

.toggle-password:hover {
  color: var(--text-secondary);
}

.toggle-password svg {
  width: 18px;
  height: 18px;
}

/* ── Submit button ── */
.btn-primary {
  width: 100%;
  padding: 14px 32px;
  background: #f0ece4;
  color: #08080c;
  border: none;
  border-radius: 100px;
  font-family: var(--font-sans);
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.02em;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  margin-top: 8px;
  position: relative;
  z-index: 1;
}

.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 32px rgba(240, 236, 228, 0.15);
}

.btn-primary:active {
  transform: translateY(0);
  box-shadow: 0 4px 16px rgba(240, 236, 228, 0.1);
}

/* ── Divider ── */
.divider {
  display: flex;
  align-items: center;
  gap: 16px;
  margin: 28px 0;
  position: relative;
  z-index: 1;
}

.divider::before,
.divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

.divider span {
  font-size: 12px;
  font-weight: 500;
  color: var(--text-tertiary);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

/* ── Social / alternative login ── */
.btn-social {
  width: 100%;
  padding: 13px 32px;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 100px;
  color: var(--text-primary);
  font-family: var(--font-sans);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.25s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  position: relative;
  z-index: 1;
}

.btn-social:hover {
  border-color: var(--border-hover);
  background: rgba(255, 255, 255, 0.02);
}

.btn-social svg {
  width: 18px;
  height: 18px;
}

/* ── Footer link ── */
.card-footer {
  text-align: center;
  margin-top: 28px;
  position: relative;
  z-index: 1;
}

.card-footer p {
  font-size: 14px;
  color: var(--text-secondary);
}

.card-footer a {
  color: var(--gold);
  text-decoration: none;
  font-weight: 500;
  transition: color 0.2s;
}

.card-footer a:hover {
  color: var(--text-primary);
}

/* ── Bottom legal ── */
.legal {
  margin-top: 24px;
  text-align: center;
  opacity: 0;
  animation: fadeUp 0.6s ease-out 0.3s forwards;
}

.legal p {
  font-size: 12px;
  color: var(--text-tertiary);
  line-height: 1.6;
}

.legal a {
  color: var(--text-secondary);
  text-decoration: none;
  transition: color 0.2s;
}

.legal a:hover {
  color: var(--text-primary);
}

/* ── Animations ── */
@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(12px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
</style>
<script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
</head>
<body>

<div class="bg-glow-gold"></div>
<div class="bg-glow-blue"></div>

<div class="onboarding-wrapper">

  <!-- Logo -->
  <div class="logo">
    <div class="logo-icon"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
    <div class="logo-text"><span>Energy</span><span>Substantiation</span></div>
  </div>

  <!-- Progress -->
  <div class="progress">
    <div class="progress-step active"></div>
    <div class="progress-step"></div>
    <div class="progress-step"></div>
    <div class="progress-step"></div>
    <span class="progress-label">Step 1 of 4</span>
  </div>

  <!-- Card -->
  <div class="card">
    <div class="card-header">
      <h1>Create Your Account</h1>
      <p>Start investing in tokenized energy commodities</p>
    </div>

    <form onsubmit="window.location.href='03-verify-email.html';return false;">
      <div class="form-group">
        <label class="form-label" for="email">Email address</label>
        <input class="form-input" type="email" id="email" placeholder="you@example.com" autocomplete="email">
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div class="input-wrapper">
          <input class="form-input" type="password" id="password" placeholder="Min. 8 characters" autocomplete="new-password">
          <button type="button" class="toggle-password" aria-label="Toggle password visibility" onclick="togglePw()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-primary" onclick="window.location.href='03-verify-email.html';return false;">Create Account</button>
    </form>

    <div class="divider"><span>or</span></div>

    <button class="btn-social" onclick="window.location.href='03-verify-email.html'">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Continue with Google
    </button>

    <div class="card-footer">
      <p>Already have an account? <a href="07-portfolio-balance.html">Sign in</a></p>
    </div>
  </div>

  <!-- Legal -->
  <div class="legal">
    <p>By creating an account you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></p>
  </div>

</div>

<script>
function togglePw() {
  const pw = document.getElementById('password');
  pw.type = pw.type === 'password' ? 'text' : 'password';
}
</script>
</body>
</html>
